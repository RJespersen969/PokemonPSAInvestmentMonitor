name: PSA Pokemon monitoring

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_report:
        description: Send rapport nu, også hvis dagens rapport allerede er sendt
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: psa-investment-monitor-state
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'RJespersen969/PokemonPSAInvestmentMonitor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_MARKET_MODE: '1'
      USD_DKK_RATE: ${{ vars.USD_DKK_RATE || '6.50' }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_PSA }}
      POKEMON_PRICE_TRACKER_API_KEY: ${{ secrets.POKEMON_PRICE_TRACKER_API_KEY || secrets.PSA_API_KEY }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install encryption dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Check configuration
        run: python tracker.py check
      - name: Restore encrypted history
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python github_state.py restore
      - name: Check prices and send Discord messages
        id: prices
        env:
          FORCE_REPORT: ${{ inputs.force_report && '1' || '0' }}
        run: |
          if [ "$FORCE_REPORT" = '1' ]; then
            python tracker.py once --force-report
          else
            python tracker.py once
          fi
      - name: Preserve encrypted history, including partial results
        if: always() && steps.restore.outcome == 'success' && steps.prices.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python github_state.py save
